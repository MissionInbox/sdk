[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "missioninbox"
version = "0.1.0"
description = "Official MissionInbox SDK for Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MissionInbox, Inc." }]
requires-python = ">=3.9"
keywords = ["missioninbox", "email", "transactional", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.25",
]

[project.urls]
Homepage = "https://github.com/MissionInbox/sdk-python"
Issues = "https://github.com/MissionInbox/sdk/issues"
Source = "https://github.com/MissionInbox/sdk-python"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-httpx>=0.30",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/missioninbox"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
