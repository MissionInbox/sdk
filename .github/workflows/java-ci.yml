name: java-ci

on:
  push:
    branches: [main]
    paths:
      - 'packages/java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    paths:
      - 'packages/java/**'
      - '.github/workflows/java-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - run: mvn -B verify
